# =====================================================
# File Manager Service application.properties
# -----------------------------------------------------
# Энэ файл нь File Manager Service-ийн үндсэн тохиргоог хадгална.
#
# File Manager Service-ийн үүрэг:
# - Frontend/API Gateway-ээс image upload request авах
# - Authorization token-ийг SOAP service-ээр validate хийх
# - Зургийг DigitalOcean Spaces object storage рүү upload хийх
# - Upload болсон image-ийн public URL буцаах
# =====================================================

# Spring Boot application-ийн нэр.
# Log дээр service-ийн нэрийг ялгаж харахад ашиглагдана.
spring.application.name=file-manager-service

# File Manager Service 8082 port дээр ажиллана.
# API Gateway нь VPC private network-ээр энэ service-ийн 8082 port руу request дамжуулдаг.
server.port=8082


# =====================================================
# Multipart file upload тохиргоо
# -----------------------------------------------------
# Frontend-ээс image upload хийх үед multipart/form-data request ирдэг.
# Энд upload хийх file болон request-ийн maximum size-г тохируулж байна.
# =====================================================

# Нэг file-ийн хамгийн их хэмжээ 10MB.
spring.servlet.multipart.max-file-size=10MB

# Нэг multipart request-ийн нийт хамгийн их хэмжээ 10MB.
spring.servlet.multipart.max-request-size=10MB


# =====================================================
# DigitalOcean Spaces тохиргоо
# -----------------------------------------------------
# DigitalOcean Spaces нь AWS S3 compatible object storage.
# Зураг upload хийхэд AWS S3 SDK ашиглаж энэ endpoint болон bucket рүү file хадгална.
# =====================================================

# DigitalOcean Spaces-ийн endpoint.
# sgp1 нь Singapore region гэсэн утгатай.
s3.endpoint=https://sgp1.digitaloceanspaces.com

# Upload хийх bucket-ийн нэр.
s3.bucket=javzaa-images

# Spaces access key.
# Security-ийн үүднээс key-г code дотор шууд бичихгүй,
# systemd environment variable-аас уншиж байна.
s3.access.key=${S3_ACCESS_KEY}

# Spaces secret key.
# Энэ мөн code дотор hardcode хийгдэхгүй, environment variable-аас уншигдана.
s3.secret.key=${S3_SECRET_KEY}


# =====================================================
# SOAP Authentication Service тохиргоо
# -----------------------------------------------------
# File upload хийхээс өмнө token valid эсэхийг SOAP service-ээр шалгана.
# Энэ URL нь VPC доторх SOAP service private endpoint байна.
# =====================================================

# User SOAP Service-ийн ValidateToken operation руу request илгээх endpoint.
soap.service.url=http://10.104.0.6:8081/ws